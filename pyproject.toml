[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "freshdock"
version = "0.2.0"
description = "Lightweight Docker auto-updater with health-gated rollout and rollback"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Clawdyy", email = "intertermux@gmail.com" }]
keywords = [
    "docker",
    "container",
    "auto-update",
    "registry",
    "healthcheck",
    "rollback",
    "devops",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
]

[project.scripts]
freshdock = "freshdock.cli:main"

[project.urls]
Homepage = "https://github.com/intertermux-code/freshdock"
Repository = "https://github.com/intertermux-code/freshdock"
Issues = "https://github.com/intertermux-code/freshdock/issues"

[tool.setuptools.packages.find]
include = ["freshdock*"]
exclude = ["freshdock.tests*"]
